# Shared by the geopilot and seed services, which talk to the same database.
x-context-connection: &contextConnection Server=db;Port=5432;Database=geopilot;User Id=HAPPYWALK;Password=SOMBERSPORK;

services:
  stac-browser:
    image: ghcr.io/radiantearth/stac-browser:5.0.0
    ports:
      - 8080:8080
    environment:
      SB_pathPrefix: "/browser/"
      SB_catalogUrl: "https://localhost:5173/api/stac"
      SB_locale: "de-CH"
      SB_fallbackLocale: "de-CH"
      SB_supportedLocales: "de-CH,fr-CH,it-CH,en"

  db:
    image: postgis/postgis
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: HAPPYWALK
      POSTGRES_PASSWORD: SOMBERSPORK
      POSTGRES_DB: geopilot
    volumes:
      - geopilot-db:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -U HAPPYWALK -d geopilot -h db"
      interval: 3s
      timeout: 1s
      retries: 20
      start_period: 25s

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - 3001:80
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@example.com
      PGADMIN_DEFAULT_PASSWORD: BOUNCEAUTO
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./config/pgadmin4-servers.json:/pgadmin4/servers.json
    entrypoint:
      - /bin/sh
      - -c
      - |
        /bin/echo '*:*:geopilot:HAPPYWALK:SOMBERSPORK' > /tmp/.pgpass
        chmod 0600 /tmp/.pgpass
        /entrypoint.sh
    depends_on:
      db:
        condition: service_healthy

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    ports:
      - 10000:10000
    volumes:
      - ./certs:/certs:ro
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck --cert /certs/cert.pem --key /certs/cert.key"

  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    ports:
      - 3310:3310
    volumes:
      - ./config/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: "clamdscan --ping 1"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  geopilot:
    build:
      context: .
      args:
        GITHUB_ACTOR: ${GITHUB_ACTOR}
      secrets:
        - github_token
    restart: unless-stopped
    ports:
      - 5173:8443
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTPS_PORTS: 8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/cert.pem
      ASPNETCORE_Kestrel__Certificates__Default__KeyPath: /https/cert.key
      ConnectionStrings__Context: *contextConnection
      ReverseProxy__Clusters__stacBrowserCluster__Destinations__stacBrowserDestination__Address: http://stac-browser:8080/
      Auth__Authority: http://localhost:4011/realms/geopilot
      Auth__PublicClientId: geopilot-client
      Auth__Audience: geopilot-api
      Auth__AuthorizationUrl: http://localhost:4011/realms/geopilot/protocol/openid-connect/auth
      Auth__UserInfoUrl: http://localhost:4011/realms/geopilot/protocol/openid-connect/userinfo
      Auth__TokenUrl: http://localhost:4011/realms/geopilot/protocol/openid-connect/token
      Auth__ApiOrigin: https://localhost:5173
      Auth__Scope: "profile email openid geopilot.api"
      Auth__SwaggerAdditionalScopes: "geopilot.api"
      Upload__Cloud__ConnectionString: "DefaultEndpointsProtocol=https;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=https://localhost:10000/devstoreaccount1;"
      Upload__Cloud__BucketName: uploads
      Upload__Cloud__BlobEndpoint: https://localhost:10000
      Upload__Cloud__AutoCreateContainer: true
      Upload__Cloud__AllowedOrigins__0: https://localhost:5173
      ClamAV__Enabled: true
      ClamAV__Host: clamav
      ClamAV__Port: 3310
      Pipeline__Definition: /pipelines/pipelines.yaml
      Delivery__UploaderDeleteEnabled: true
      MachineDelivery__Enabled: true
      Delivery__DeleteDuration: ""
      Delivery__DeleteRestrictInterval: ""
      Ilitools__IlitoolsWrapperAddress: http://ilitools-wrapper:5555
      PUID: 1000
      PGID: 1000
    volumes:
      - ./src/Geopilot.Api/Downloads:/downloads
      - ./src/Geopilot.Api/Persistent:/assets
      - ./src/Geopilot.Api/Resources:/resources
      - ./src/Geopilot.Api/PipelineDefinitions/basicPipeline_01.yaml:/pipelines/pipelines.yaml:ro
      - ./src/Geopilot.Frontend/devPublic:/public
      - ./certs:/https:ro
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  # Creates the local test data. Waits until the migrations are applied and then exits, so it works
  # whether the API runs in the geopilot container or on the host from Visual Studio. No depends_on
  # for geopilot: that service is set to DoNotStart in launchSettings.json and must stay that way.
  seed:
    build:
      context: .
      target: seed
      args:
        GITHUB_ACTOR: ${GITHUB_ACTOR}
      secrets:
        - github_token
    environment:
      ConnectionStrings__Context: *contextConnection
    depends_on:
      db:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    environment:
      - KEYCLOAK_ADMIN=SOMBERTOTE
      - KEYCLOAK_ADMIN_PASSWORD=STRANGENIGHT
    volumes:
      - ./config/realms:/opt/keycloak/data/import
    ports:
      - "4011:8080"
    command: start-dev --import-realm

  ilitools-wrapper:
    image: ghcr.io/geowerkstatt/ilitools-wrapper:v1.1.16
    restart: unless-stopped
    ports:
      - 5555:5555
    environment:
      # The model repository below is reachable under a container address, which the wrapper rejects by default.
      MODELDIR_ALLOW_PRIVATE_NETWORKS: true
    volumes:
      # Named, so the model cache and the GWR database survive a recreated container.
      - ilitools-cache:/var/cache/ilicache
      # Filled by dmav-plugin (profile dmav); empty otherwise, which offers no plugin.
      - ilitools-plugins:/plugins

  # Serves TestData/XtfErrorVisualization/ili-repository as an INTERLIS model repository, so a checkout has models
  # and a validation profile to work with. Its ilisite.xml chains to models.interlis.ch, so the public models stay
  # available through it. The DMAV test world (TestData/Dmav/README.md) is served under /dmav/.
  interlis-models:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - 3081:80
    volumes:
      - ./TestData/XtfErrorVisualization/ili-repository:/usr/share/nginx/html:ro
      - ./TestData/Dmav/repository:/usr/share/nginx/dmav:ro
      - ./config/nginx-interlis-models.conf:/etc/nginx/conf.d/default.conf:ro

  # Fetches the GWR plugin for the DMAV test world into the plugin volume of the wrapper, checked against its
  # SHA-256 and skipped when already there. Only with --profile dmav, see TestData/Dmav/README.md. The files are
  # staged in a separate folder and renamed at the end, because the wrapper offers a folder as soon as it holds a jar.
  dmav-plugin:
    image: nginx:alpine
    profiles: [dmav]
    volumes:
      - ilitools-plugins:/plugins
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        id=ilivalid-gwr@1.0.0-20260217.141026-7
        plugin=ilivalid-gwr-1.0.0-20260217.141026-7.jar
        plugin_url=https://jars.interlis.ch/ch/interlis/ilivalid-gwr/1.0.0-SNAPSHOT/$$plugin
        plugin_sha=b165cae1d0f6be6b642b8ae9da1bc19628a2998b7dd426b1c38e738ba6740d0f
        sqlite=sqlite-jdbc-3.43.0.0.jar
        sqlite_url=https://repo1.maven.org/maven2/org/xerial/sqlite-jdbc/3.43.0.0/$$sqlite
        sqlite_sha=50524b16b649fb03f81df6e61dec69911b8849e6943c61b85faa24e49bfd98fc
        verify() { echo "$$2  $$1" | sha256sum -c >/dev/null 2>&1; }
        if verify "/plugins/$$id/$$plugin" "$$plugin_sha" && verify "/plugins/$$id/$$sqlite" "$$sqlite_sha"; then
          echo "$$id present"
          exit 0
        fi
        stage="/plugins/.$$id.part"
        rm -rf "$$stage"
        mkdir -p "$$stage"
        wget -q -O "$$stage/$$sqlite" "$$sqlite_url"
        wget -q -O "$$stage/$$plugin" "$$plugin_url"
        verify "$$stage/$$sqlite" "$$sqlite_sha" || { echo "$$sqlite: checksum mismatch" >&2; exit 1; }
        verify "$$stage/$$plugin" "$$plugin_sha" || { echo "$$plugin: checksum mismatch" >&2; exit 1; }
        rm -rf "/plugins/$$id"
        mv "$$stage" "/plugins/$$id"
        echo "$$id fetched"

volumes:
  geopilot-db:
  ilitools-cache:
  ilitools-plugins:

secrets:
  github_token:
    environment: GITHUB_TOKEN
