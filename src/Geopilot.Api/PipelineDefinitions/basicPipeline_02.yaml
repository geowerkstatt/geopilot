# Beispiel einer Pipeline-Definition. Format, Prozessoren und Plugin-System sind
# unter docs/pipeline/Pipelines.md dokumentiert.
processes:
  - id: xtf_matcher
    implementation: Geopilot.Pipeline.Processes.Matcher.XtfMatcher.XtfMatcherProcess
    default_config:
      fileExtensions:
        - xtf
      fileNamePatterns:
  - id: file_matcher
    implementation: Geopilot.Pipeline.Processes.Matcher.FileMatcher.FileMatcherProcess
    default_config:
      fileExtensions:
      fileNamePatterns:
  - id: xtf_validator
    implementation: Geopilot.Pipeline.Processes.XtfValidation.XtfValidatorProcess
    default_config:
      validationProfile:
      refMappingFile:
      pluginIds:
      toolVersion:
  - id: xtf_error_visualizer
    implementation: Geopilot.Pipeline.Processes.XtfErrorVisualization.XtfErrorVisualizationProcess
    default_config:
      include:
        - map
        - tree
      groupBy:
        - model
        - topic
        - class
        - errorType
      filterBy:
        - model
        - topic
        - class
        - errorType
  - id: zip_packager
    implementation: Geopilot.Pipeline.Processes.ZipPackage.ZipPackageProcess
  - id: unzipper
    implementation: Geopilot.Pipeline.Processes.Unzip.UnzipProcess
  - id: xtf_metadata
    implementation: Geopilot.Pipeline.Processes.XtfMetadata.XtfMetadataExtractorProcess
    default_config:
      # Für DMAV die Gemeinde ohne Untergang; die Regel des Modells (VIEW Gemeinde_Gueltig) wäre fetch: CurrentlyValid ohne Filter.
      scope:
        path: "DMAV_HoheitsgrenzenAV_V1_0:Gemeinde[not(DMAV_HoheitsgrenzenAV_V1_0:Untergang)]/DMAV_HoheitsgrenzenAV_V1_0:BFSNummer"
        fetch: Single
  - id: xtf_diff
    implementation: Geopilot.Pipeline.Processes.XtfDiff.XtfDiffProcess
pipelines:
  - id: ili_validation
    display_name:
      en: XTF Validation
      de: XTF Validierung
      fr: XTF Validation
      it: XTF Validazione
    steps:
      - id: xtf_matching
        display_name:
          en: XTF Matching
          de: XTF Zuordnung
          fr: XTF Correspondance
          it: XTF Corrispondenza
        process_id: xtf_matcher
        input:
          files: "${upload()}"
        output_actions:
          - property: XtfFiles
            actions:
              - Delivery
          - property: UnmatchedFiles
            actions:
              - Delivery
          - property: StatusMessage
            actions:
              - StatusMessage
      # Selektiert die mitgelieferten Modelle der Lieferung; die Pipeline entscheidet damit explizit,
      # was als Modell an die Validierung geht.
      - id: ili_matching
        display_name:
          en: Model Matching
          de: Modell Zuordnung
          fr: Correspondance des modèles
          it: Corrispondenza dei modelli
        process_id: file_matcher
        process_config_overwrites:
          fileExtensions:
            - ili
        input:
          files: "${upload()}"
        output_actions:
          - property: StatusMessage
            actions:
              - StatusMessage
      - id: validation
        display_name:
          en: XTF Validation
          de: XTF Validierung
          fr: XTF Validation
          it: XTF Validazione
        process_id: xtf_validator
        conditions:
          pre:
            fail_conditions:
              - id: exactly-one-xtf-required
                expression: "Length([xtf_matching.XtfFiles]) != 1"
                message:
                  de: "Es muss genau eine XTF-Datei hochgeladen werden."
                  en: "Exactly one XTF file must be uploaded."
                  fr: "Exactement un fichier XTF doit être téléchargé."
                  it: "Deve essere caricato esattamente un file XTF."
          post:
            restrict_delivery_conditions:
              - id: validation-failed
                expression: "!([validation.ValidationSuccessful])"
                message:
                  de: "Die Validierung war nicht erfolgreich."
                  en: "Validation was not successful."
                  fr: "La validation n'a pas réussi."
                  it: "La validazione non è riuscita."
        input:
          transferFile: "${step_output(xtf_matching.XtfFiles)}"
          modelFiles: "${step_output(ili_matching.MatchedFiles)}"
        output_actions:
          - property: ErrorLog
            actions:
              - Download
              - Delivery
          - property: XtfLog
            actions:
              - Download
              - Delivery
          - property: StatusMessage
            actions:
              - StatusMessage
      - id: map_visualization
        display_name:
          en: Map Visualization
          de: Kartenvisualisierung
          it: Visualizzazione cartografica
          fr: Visualisation cartographique
        process_id: xtf_error_visualizer
        process_config_overwrites:
          include:
            - map
        conditions:
          pre:
            skip_conditions:
              - id: validation-successful
                expression: "[validation.ValidationSuccessful]"
                message:
                  de: "Validierung erfolgreich. Kartenvisualisierung wird übersprungen."
                  en: "Validation successful. Map visualization will be skipped."
                  fr: "Validation réussie. La visualisation cartographique sera ignorée."
                  it: "Validazione riuscita. La visualizzazione cartografica sarà ignorata."
        input:
          xtfLog: "${step_output(validation.XtfLog)}"
        output_actions:
          - property: Visualization
            actions:
              - Visualization
          - property: StatusMessage
            actions:
              - StatusMessage
  - id: ili_validation_with_visualization_and_zip
    display_name:
      en: XTF Validation with Visualization
      de: XTF Validierung mit Visualisierung
      it: Validazione XTF con visualizzazione
      fr: Validation XTF avec visualisation
    steps:
      - id: xtf_matching
        display_name:
          en: XTF Matching
          de: XTF Zuordnung
          it: Corrispondenza XTF
          fr: Correspondance XTF
        process_id: xtf_matcher
        input:
          files: "${upload()}"
        output_actions:
          - property: XtfFiles
            actions:
              - Delivery
          - property: UnmatchedFiles
            actions:
              - Delivery
          - property: StatusMessage
            actions:
              - StatusMessage
      - id: validation
        display_name:
          en: XTF Validation
          de: XTF Validierung
          it: Validazione XTF
          fr: Validation XTF
        process_id: xtf_validator
        conditions:
          pre:
            fail_conditions:
              - id: exactly-one-xtf-required
                expression: "Length([xtf_matching.XtfFiles]) != 1"
                message:
                  de: "Es muss genau eine XTF-Datei hochgeladen werden."
                  en: "Exactly one XTF file must be uploaded."
                  fr: "Exactement un fichier XTF doit être téléchargé."
                  it: "Deve essere caricato esattamente un file XTF."
          post:
            restrict_delivery_conditions:
              - id: validation-failed
                expression: "!([validation.ValidationSuccessful])"
                message:
                  de: "Die Validierung war nicht erfolgreich."
                  en: "Validation was not successful."
                  fr: "La validation n'a pas réussi."
                  it: "La validazione non è riuscita."
        input:
          transferFile: "${step_output(xtf_matching.XtfFiles)}"
        output_actions:
          - property: ErrorLog
            actions:
              - Download
              - Delivery
          - property: XtfLog
            actions:
              - Download
              - Delivery
          - property: StatusMessage
            actions:
              - StatusMessage
      - id: error_tree
        display_name:
          de: XTF-Visualisierung
          en: XTF-Visualization
          it: Visualizzazione XTF
          fr: Visualisation XTF
        process_id: xtf_error_visualizer
        conditions:
          pre:
            skip_conditions:
              - id: validation-successful
                expression: "[validation.ValidationSuccessful]"
                message:
                  de: "Validierung erfolgreich. Visualisierung wird übersprungen."
                  en: "Validation successful. Visualization will be skipped."
                  fr: "Validation réussie. La visualisation sera ignorée."
                  it: "Validazione riuscita. La visualizzazione sarà ignorata."
        input:
          xtfLog: "${step_output(validation.XtfLog)}"
        output_actions:
          - property: Visualization
            actions:
              - Visualization
          - property: StatusMessage
            actions:
              - StatusMessage
      - id: zip_packaging
        display_name:
          en: ZIP Packaging
          de: ZIP Packet
          it: Creazione ZIP
          fr: Création ZIP
        process_id: zip_packager
        input:
          input:
            - "${step_output(xtf_matching.XtfFiles)}"
            - "${step_output(validation.XtfLog)}"
            - "${step_output(validation.ErrorLog)}"
        output_actions:
          - property: ZipPackage
            actions:
              - Download
              - Delivery
          - property: StatusMessage
            actions:
              - StatusMessage
  - id: ili_validation_with_map_and_error_tree
    display_name:
      en: XTF Validation with Map and Error Tree
      de: XTF Validierung mit Karte und Error Tree
      it: Validazione XTF con mappa e albero degli errori
      fr: Validation XTF avec carte et arbre des erreurs
    steps:
      - id: xtf_matching
        display_name:
          en: Analyzing uploaded files
          de: Hochgeladene Dateien werden analysiert
          it: Analisi dei file caricati
          fr: Analyse des fichiers téléversés
        process_id: xtf_matcher
        input:
          files: "${upload()}"
        output_actions:
          - property: XtfFiles
            actions:
              - Delivery
          - property: UnmatchedFiles
            actions:
              - Delivery
          - property: StatusMessage
            actions:
              - StatusMessage
      - id: validation
        display_name:
          en: Validating XTF file
          de: XTF Datei wird validiert
          it: Validazione del file XTF
          fr: Validation du fichier XTF
        process_id: xtf_validator
        conditions:
          pre:
            fail_conditions:
              - id: exactly-one-xtf-required
                expression: "Length([xtf_matching.XtfFiles]) != 1"
                message:
                  de: "Es muss genau eine XTF-Datei hochgeladen werden."
                  en: "Exactly one XTF file must be uploaded."
                  fr: "Exactement un fichier XTF doit être téléchargé."
                  it: "Deve essere caricato esattamente un file XTF."
          post:
            restrict_delivery_conditions:
              - id: validation-failed
                expression: "!([validation.ValidationSuccessful])"
                message:
                  de: "Die Validierung war nicht erfolgreich."
                  en: "Validation was not successful."
                  fr: "La validation n'a pas réussi."
                  it: "La validazione non è riuscita."
        input:
          transferFile: "${step_output(xtf_matching.XtfFiles)}"
        output_actions:
          - property: ErrorLog
            actions:
              - Download
              - Delivery
          - property: XtfLog
            actions:
              - Download
              - Delivery
          - property: StatusMessage
            actions:
              - StatusMessage
      - id: error_visualization
        display_name:
          en: Error Visualization
          de: Fehlervisualisierung
          it: Visualizzazione degli errori
          fr: Visualisation des erreurs
        process_id: xtf_error_visualizer
        conditions:
          pre:
            skip_conditions:
              - id: validation-successful
                expression: "[validation.ValidationSuccessful]"
                message:
                  de: "Validierung erfolgreich. Fehlervisualisierung wird übersprungen."
                  en: "Validation successful. Error visualization will be skipped."
                  fr: "Validation réussie. La visualisation des erreurs sera ignorée."
                  it: "Validazione riuscita. La visualizzazione degli errori sarà ignorata."
        input:
          xtfLog: "${step_output(validation.XtfLog)}"
        output_actions:
          - property: Visualization
            actions:
              - Visualization
          - property: StatusMessage
            actions:
              - StatusMessage
  # Eine Lieferung darf gepackt oder als blosse Transferdatei ankommen. Das Entpacken entfällt, wenn
  # kein Archiv dabei ist, und die nachfolgenden Schritte lesen den Upload zusammen mit den Ausgaben
  # des möglicherweise übersprungenen Schrittes. Ohne diese Fähigkeit müsste die Pipeline ab dem
  # Entpacken zweimal geschrieben werden, je einmal pro Liefervariante.
  - id: ili_validation_packed_or_plain
    display_name:
      en: XTF Validation, packed or plain
      de: XTF Validierung, gepackt oder einzeln
      fr: Validation XTF, compressée ou simple
      it: Validazione XTF, compressa o singola
    steps:
      - id: zip_matching
        display_name:
          en: Archive Matching
          de: Archiv Zuordnung
          fr: Correspondance de l'archive
          it: Corrispondenza dell'archivio
        process_id: file_matcher
        conditions:
          post:
            fail_conditions:
              - id: at-most-one-archive
                expression: "Length([zip_matching.MatchedFiles]) > 1"
                message:
                  de: "Es darf höchstens ein ZIP-Archiv hochgeladen werden."
                  en: "At most one ZIP archive may be uploaded."
                  fr: "Une seule archive ZIP au maximum peut être téléchargée."
                  it: "È possibile caricare al massimo un archivio ZIP."
        process_config_overwrites:
          fileExtensions:
            - zip
        input:
          files: "${upload()}"
        output_actions:
          - property: StatusMessage
            actions:
              - StatusMessage
      - id: unzip
        display_name:
          en: Unzip Archive
          de: Archiv entpacken
          fr: Décompresser l'archive
          it: Decomprimere l'archivio
        process_id: unzipper
        conditions:
          pre:
            skip_conditions:
              - id: nothing-to-unpack
                expression: "Length([zip_matching.MatchedFiles]) == 0"
                message:
                  de: "Kein ZIP-Archiv geliefert. Das Entpacken wird übersprungen."
                  en: "No ZIP archive delivered. Unpacking will be skipped."
                  fr: "Aucune archive ZIP livrée. La décompression sera ignorée."
                  it: "Nessun archivio ZIP consegnato. La decompressione sarà ignorata."
        input:
          zipFile: "${step_output(zip_matching.MatchedFiles)}"
        output_actions:
          - property: StatusMessage
            actions:
              - StatusMessage
      - id: xtf_matching_upload
        display_name:
          en: Upload XTF Matching
          de: Upload XTF Zuordnung
          fr: Upload XTF Correspondance
          it: Upload XTF Corrispondenza
        process_id: xtf_matcher
        input:
          files: "${upload()}"
        output_actions:
          - property: XtfFiles
            actions:
              - Delivery
          - property: StatusMessage
            actions:
              - StatusMessage
      - id: xtf_matching_zip
        display_name:
          en: ZIP XTF Matching
          de: ZIP XTF Zuordnung
          fr: ZIP XTF Correspondance
          it: ZIP XTF Corrispondenza
        process_id: xtf_matcher
        conditions:
          pre:
            skip_conditions:
              - id: nothing-unpacked
                expression: "Length([unzip.ExtractedFiles]) == 0"
                message:
                  de: "Kein Archiv entpackt. Es gibt keine Dateien aus dem Archiv zu prüfen."
                  en: "No archive unpacked. There are no files from the archive to match."
                  fr: "Aucune archive décompressée. Aucun fichier de l'archive à vérifier."
                  it: "Nessun archivio decompresso. Nessun file dall'archivio da verificare."
        input:
          files: "${step_output(unzip.ExtractedFiles)}"
        output_actions:
          - property: XtfFiles
            actions:
              - Delivery
          - property: StatusMessage
            actions:
              - StatusMessage
      - id: validation
        display_name:
          en: XTF Validation
          de: XTF Validierung
          fr: XTF Validation
          it: XTF Validazione
        process_id: xtf_validator
        conditions:
          pre:
            fail_conditions:
              - id: exactly-one-xtf-required
                expression: "Length([xtf_matching_upload.XtfFiles]) + Length([xtf_matching_zip.XtfFiles]) != 1"
                message:
                  de: "Es muss genau eine XTF-Datei geliefert werden, einzeln oder im Archiv."
                  en: "Exactly one XTF file must be delivered, plain or inside the archive."
                  fr: "Exactement un fichier XTF doit être livré, seul ou dans l'archive."
                  it: "Deve essere consegnato esattamente un file XTF, singolo o nell'archivio."
          post:
            restrict_delivery_conditions:
              - id: validation-failed
                expression: "!([validation.ValidationSuccessful])"
                message:
                  de: "Die Validierung war nicht erfolgreich."
                  en: "Validation was not successful."
                  fr: "La validation n'a pas réussi."
                  it: "La validazione non è riuscita."
        input:
          transferFile:
            - "${step_output(xtf_matching_upload.XtfFiles)}"
            - "${step_output(xtf_matching_zip.XtfFiles)}"
        output_actions:
          - property: ErrorLog
            actions:
              - Download
              - Delivery
          - property: XtfLog
            actions:
              - Download
              - Delivery
          - property: StatusMessage
            actions:
              - StatusMessage
  # DMAV mit Zusatzanforderungen: liest die BFS-Nummer aus der Lieferung und prüft gegen die Referenzdaten dieser
  # Gemeinde, samt GWR-Plugin. Braucht die DMAV-Testwelt (TestData/Dmav/README.md): das Repository, das der Wrapper
  # als %REPOSITORIES/dmav@0.1.1 anbietet, für Profil und Referenzdaten, das Mapping unter Resources/dmav/ und das
  # Plugin aus dem Compose-Profil dmav; ohne Plugin scheitert der Schritt.
  - id: dmav_validation
    display_name:
      en: DMAV Validation with Additional Requirements
      de: DMAV-Validierung mit Zusatzanforderungen
      it: Validazione DMAV con requisiti supplementari
      fr: Validation DMAV avec exigences supplémentaires
    steps:
      - id: xtf_matching
        display_name:
          en: Analyzing uploaded files
          de: Hochgeladene Dateien werden analysiert
          it: Analisi dei file caricati
          fr: Analyse des fichiers téléversés
        process_id: xtf_matcher
        conditions:
          post:
            fail_conditions:
              - id: exactly-one-xtf-required
                expression: "Length([xtf_matching.XtfFiles]) != 1"
                message:
                  de: "Es muss genau eine XTF-Datei hochgeladen werden."
                  en: "Exactly one XTF file must be uploaded."
                  fr: "Exactement un fichier XTF doit être téléchargé."
                  it: "Deve essere caricato esattamente un file XTF."
        input:
          files: "${upload()}"
        output_actions:
          - property: XtfFiles
            actions:
              - Delivery
          - property: UnmatchedFiles
            actions:
              - Delivery
          - property: StatusMessage
            actions:
              - StatusMessage
      - id: metadata
        display_name:
          en: Determining the municipality
          de: Gemeinde wird bestimmt
          it: Determinazione del comune
          fr: Détermination de la commune
        process_id: xtf_metadata
        conditions:
          post:
            fail_conditions:
              - id: xtf-not-readable
                expression: "[metadata.FileState] != 'Readable'"
                message:
                  de: "Die Transferdatei ist kein lesbarer INTERLIS-2.4-Transfer."
                  en: "The transfer file is not a readable INTERLIS 2.4 transfer."
                  fr: "Le fichier de transfert n'est pas un transfert INTERLIS 2.4 lisible."
                  it: "Il file di trasferimento non è un trasferimento INTERLIS 2.4 leggibile."
              - id: scope-required
                expression: "[metadata.FileState] == 'Readable' && [metadata.Scope] == null"
                message:
                  de: "Die BFS-Nummer der Gemeinde liess sich nicht aus der Lieferung lesen."
                  en: "The BFS number of the municipality could not be read from the delivery."
                  fr: "Le numéro OFS de la commune n'a pas pu être lu dans la livraison."
                  it: "Non è stato possibile leggere il numero UST del comune dalla fornitura."
        input:
          transferFile: "${step_output(xtf_matching.XtfFiles)}"
        output_actions:
          - property: StatusMessage
            actions:
              - StatusMessage
      - id: validation
        display_name:
          en: Validating XTF file
          de: XTF Datei wird validiert
          it: Validazione del file XTF
          fr: Validation du fichier XTF
        process_id: xtf_validator
        process_config_overwrites:
          validationProfile: dmav_v1_1_with_additional_rules
          refMappingFile: dmav/refdata_mapping.xtf
          pluginIds: ilivalid-gwr@1.0.0-20260217.141026-7
          toolVersion: 1.15.1-INTERNAL-GEOWERKSTATT-SNAPSHOT
        conditions:
          post:
            restrict_delivery_conditions:
              - id: validation-failed
                expression: "!([validation.ValidationSuccessful])"
                message:
                  de: "Die Validierung war nicht erfolgreich."
                  en: "Validation was not successful."
                  fr: "La validation n'a pas réussi."
                  it: "La validazione non è riuscita."
        input:
          transferFile: "${step_output(xtf_matching.XtfFiles)}"
          scope: "${step_output(metadata.Scope)}"
        output_actions:
          - property: ErrorLog
            actions:
              - Download
              - Delivery
          - property: XtfLog
            actions:
              - Download
              - Delivery
          - property: StatusMessage
            actions:
              - StatusMessage
      - id: error_visualization
        display_name:
          en: Error Visualization
          de: Fehlervisualisierung
          it: Visualizzazione degli errori
          fr: Visualisation des erreurs
        process_id: xtf_error_visualizer
        conditions:
          pre:
            skip_conditions:
              - id: validation-successful
                expression: "[validation.ValidationSuccessful]"
                message:
                  de: "Validierung erfolgreich. Fehlervisualisierung wird übersprungen."
                  en: "Validation successful. Error visualization will be skipped."
                  fr: "Validation réussie. La visualisation des erreurs sera ignorée."
                  it: "Validazione riuscita. La visualizzazione degli errori sarà ignorata."
        input:
          xtfLog: "${step_output(validation.XtfLog)}"
        output_actions:
          - property: Visualization
            actions:
              - Visualization
          - property: StatusMessage
            actions:
              - StatusMessage
  # Vergleicht zwei hochgeladene Stände einer Transferdatei. Bis zum eigenen Zuordnungsschritt (#1053) erkennen
  # zwei Matcher den alten und den neuen Stand an den Wörtern alt/old und neu/new im Dateinamen.
  - id: xtf_diff
    display_name:
      en: XTF Comparison
      de: XTF Vergleich
      fr: Comparaison XTF
      it: Confronto XTF
    steps:
      - id: old_xtf
        display_name:
          en: Old State
          de: Alter Stand
          fr: Ancien état
          it: Stato precedente
        process_id: xtf_matcher
        process_config_overwrites:
          fileNamePatterns:
            - '(?i)(^|[^a-z0-9])(alt|old)([^a-z0-9]|$)'
        input:
          files: "${upload()}"
        output_actions:
          - property: StatusMessage
            actions:
              - StatusMessage
      - id: new_xtf
        display_name:
          en: New State
          de: Neuer Stand
          fr: Nouvel état
          it: Stato attuale
        process_id: xtf_matcher
        process_config_overwrites:
          fileNamePatterns:
            - '(?i)(^|[^a-z0-9])(neu|new)([^a-z0-9]|$)'
        input:
          files: "${upload()}"
        output_actions:
          - property: XtfFiles
            actions:
              - Delivery
          - property: StatusMessage
            actions:
              - StatusMessage
      - id: comparison
        display_name:
          en: Comparison
          de: Vergleich
          fr: Comparaison
          it: Confronto
        process_id: xtf_diff
        conditions:
          pre:
            fail_conditions:
              - id: one-old-and-one-new-state
                expression: "Length([old_xtf.XtfFiles]) != 1 || Length([new_xtf.XtfFiles]) != 1"
                message:
                  de: "Es braucht genau eine XTF-Datei mit alt oder old und genau eine mit neu oder new im Namen."
                  en: "Exactly one XTF file with old or alt and exactly one with new or neu in its name is required."
                  fr: "Il faut exactement un fichier XTF avec alt ou old et exactement un avec neu ou new dans son nom."
                  it: "Serve esattamente un file XTF con alt o old ed esattamente uno con neu o new nel nome."
          post:
            fail_conditions:
              - id: states-not-comparable
                expression: "[comparison.ComparisonState] != 'Compared'"
                message:
                  de: "Die beiden Stände lassen sich nicht vergleichen."
                  en: "The two states cannot be compared."
                  fr: "Les deux états ne peuvent pas être comparés."
                  it: "I due stati non possono essere confrontati."
        input:
          oldXtf: "${step_output(old_xtf.XtfFiles)}"
          newXtf: "${step_output(new_xtf.XtfFiles)}"
        output_actions:
          - property: StatusMessage
            actions:
              - StatusMessage
          - property: Diff
            actions:
              - Download
          - property: Log
            actions:
              - Download
