# Reference data the refdata-update service (profile dmav) fetches into the DMAV test world, format in the README of
# https://github.com/geowerkstatt/refdata-update. These files are not checked in. A new source also needs a line in
# .gitignore, an entry in TestData/Dmav/repository/ilidata.xml whose path is its destination, a model the modelDirs
# resolve and an entry in src/Geopilot.Api/Resources/dmav/refdata_mapping.xtf per scope (docs/Referenzdaten.md).

- source: https://data.geo.admin.ch/ch.swisstopo.fixpunkte-lfp1/fixpunkte-lfp1/fixpunkte-lfp1_2056_5728.xtf.zip
  extract:
    - entry: FixpunkteLV_V1_0.xtf
      destination: dmav_V1_1/refdata/FixpunkteLV_V1_0_LFP1.xtf

# HFP1 is left out, swisstopo publishes it with the same basket id as LFP1 (#1030).

- source: https://data.geo.admin.ch/ch.swisstopo.hoheitsgrenze-landesvermessung/hoheitsgrenze-landesvermessung/hoheitsgrenze-landesvermessung_2056.xtf.zip
  extract:
    - entry: hoheitsgrenze-landesvermessung_2056.xtf
      destination: dmav_V1_1/refdata/hoheitsgrenze-landesvermessung_2056.xtf

- source: https://data.geo.admin.ch/ch.swisstopo-vd.ortschaftenverzeichnis_plz/ortschaftenverzeichnis_plz/ortschaftenverzeichnis_plz_2056.xtf.zip
  extract:
    - entry: AMTOVZ_INTERLIS24/OfficialIndexOfLocalities_V1_0.xtf
      destination: dmav_V1_1/refdata/OfficialIndexOfLocalities_V1_0.xtf
