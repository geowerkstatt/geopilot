# Reference data refreshed by the refdata-update service (profile dmav), format in
# docker/refdata-update/sources.example.yaml. Replaces cut files of the DMAV test world with the current full ones.

- source: https://data.geo.admin.ch/ch.swisstopo.fixpunkte-lfp1/fixpunkte-lfp1/fixpunkte-lfp1_2056_5728.xtf.zip
  extract:
    - entry: FixpunkteLV_V1_0.xtf
      destination: dmav_V1_1/refdata/FixpunkteLV_V1_0_LFP1.xtf

# HFP1 is left out, it shares the basket id of LFP1 (see sources.example.yaml).

- source: https://data.geo.admin.ch/ch.swisstopo.hoheitsgrenze-landesvermessung/hoheitsgrenze-landesvermessung/hoheitsgrenze-landesvermessung_2056.xtf.zip
  extract:
    - entry: hoheitsgrenze-landesvermessung_2056.xtf
      destination: dmav_V1_1/refdata/hoheitsgrenze-landesvermessung_2056.xtf

- source: https://data.geo.admin.ch/ch.swisstopo-vd.ortschaftenverzeichnis_plz/ortschaftenverzeichnis_plz/ortschaftenverzeichnis_plz_2056.xtf.zip
  extract:
