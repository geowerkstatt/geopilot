# Serves the test repository at / and the DMAV test world at /dmav/. A mount point below the read-only root mount
# cannot be created, so the DMAV repository is mounted beside it and published by alias.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
    }

    location /dmav/ {
        alias /usr/share/nginx/dmav/;
    }

    # Reference data refreshed by refdata-update (profile refdata) wins over the cut file of the test world.
    location ~ ^/dmav/(dmav_V1_1/refdata/.+)$ {
        root /usr/share/nginx;
        try_files /refdata/$1 /dmav/$1 =404;
    }
}
