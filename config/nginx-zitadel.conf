# Puts the ZITADEL API and the separate login UI under one origin, which the OIDC issuer
# (http://localhost:4012) requires. Derived from the official ZITADEL nginx example
# (zitadel/zitadel, apps/docs/content/self-hosting/manage/reverseproxy/nginx).
events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS. Needed because the upstreams below are passed as variables: with a
    # literal host name nginx resolves it once at startup and keeps the address for the life of
    # the worker, so a restarted zitadel-login (restart: unless-stopped) gets a new container IP
    # and this proxy answers 502 until it is restarted by hand.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        # 4012 inside and outside (published as 4012:4012), so the browser and zitadel-provision
        # both send Host: localhost:4012, which is the issuer ZITADEL expects.
        #
        # The IPv6 listener is required, not cosmetic: inside a container "localhost" resolves to
        # ::1 only, so without it zitadel-provision gets a refused connection.
        listen 4012;
        listen [::]:4012;
        # ZITADEL serves REST and gRPC over h2c on the same port, so everything below
        # location / is forwarded as HTTP/2 via grpc_pass.
        http2 on;

        # $http_host, not $host: $host drops the port, and ZITADEL builds its issuer and
        # redirect URLs from the forwarded host. The official example can use $host because it
        # runs on port 80, where there is no port to preserve.
        location /ui/v2/login {
            set $zitadel_login zitadel-login;
            proxy_pass http://$zitadel_login:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $zitadel_api zitadel;
            grpc_pass grpc://$zitadel_api:8080;
            grpc_set_header Host $http_host;
            grpc_set_header X-Forwarded-Proto $scheme;
        }
    }
}
