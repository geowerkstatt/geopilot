# Puts the ZITADEL API and the separate login UI under one origin, which the OIDC issuer
# (http://localhost:4012) requires. In the cluster Traefik does this job; locally nginx is
# the smallest thing that does the same. Derived from the official ZITADEL nginx example
# (zitadel/zitadel, apps/docs/content/self-hosting/manage/reverseproxy/nginx).
events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        # ZITADEL serves REST and gRPC over h2c on the same port, so everything below
        # location / is forwarded as HTTP/2 via grpc_pass.
        http2 on;

        # $http_host, not $host: $host drops the port, and ZITADEL builds its issuer and
        # redirect URLs from the forwarded host. Without the port every generated URL would
        # point at http://localhost and the login flow would break. The official example can
        # use $host because it runs on port 80, where there is no port to preserve.
        location /ui/v2/login {
            proxy_pass http://zitadel-login:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            grpc_pass grpc://zitadel:8080;
            grpc_set_header Host $http_host;
            grpc_set_header X-Forwarded-Proto $scheme;
        }
    }
}
