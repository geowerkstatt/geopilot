["DMAV_Gebaeudeadressen_V1_1.Gebaeudeadressen.Lokalisation.CH120501"]
message_de="(CH120501) Handelt es sich beim Objekt 'Lokalisation' um eine 'Strasse' oder einen 'Platz' ist eine Geometrie der Struktur 'Strassenstueck' zu erfassen. Handelt es sich beim Objekt 'Lokalisation' um keine 'Strasse' oder keinen 'Platz', ist keine Geometrie der Struktur 'Strassenstueck' zu erfassen."
message="(CH120501) Handelt es sich beim Objekt 'Lokalisation' um eine 'Strasse' oder einen 'Platz' ist eine Geometrie der Struktur 'Strassenstueck' zu erfassen. Handelt es sich beim Objekt 'Lokalisation' um keine 'Strasse' oder keinen 'Platz', ist keine Geometrie der Struktur 'Strassenstueck' zu erfassen."
message_fr="(CH120501) Si l'objet 'Localisation' est une 'rue' ou une 'place', une géométrie de la structure 'TronconRue' doit être saisie. Si l'objet 'localisation' n'est pas une 'rue' ou une 'place', aucune géométrie de la structure ' rue ' ne doit être saisie."
message_it="(CH120501) Se l'oggetto 'Localizzazione' è una 'via' o una 'piazza', deve essere registrata una geometria della struttura 'TrattoVia'. Se l'oggetto 'Localizzazione' non è una 'via' o una 'piazza', non deve essere registrata alcuna geometria della struttura 'TrattoVia'."
["DMAV_Gebaeudeadressen_V1_1.Gebaeudeadressen.Lokalisation.CH120502"]
message_de="(CH120502) Handelt es sich beim Objekt 'Lokalisation' um ein 'BenanntesGebiet' ist eine Geometrie der Struktur 'BenanntesGebiet' zu erfassen. Handelt es sich beim Objekt 'Lokalisation' um kein 'BenanntesGebiet', ist keine Geometrie der Struktur 'BenanntesGebiet' zu erfassen."
message="(CH120502) Handelt es sich beim Objekt 'Lokalisation' um ein 'BenanntesGebiet' ist eine Geometrie der Struktur 'BenanntesGebiet' zu erfassen. Handelt es sich beim Objekt 'Lokalisation' um kein 'BenanntesGebiet', ist keine Geometrie der Struktur 'BenanntesGebiet' zu erfassen."
message_fr="(CH120502) Si l'objet ' Localisation ' est un 'LieuDenomme', une géométrie de la structure 'LieuDenomme' doit être saisie. Si l'objet ' localisation ' n'est pas une 'LieuDenomme', aucune géométrie de la structure 'LieuDenomme' ne doit être saisie."
message_it="(CH120502) Se l'oggetto 'Localizzazione' è una 'ZonaDenominata', deve essere registrata una geometria della struttura 'ZonaDenominata'. Se l'oggetto 'Localizzazione' non è una 'ZonaDenominata', non deve essere registrata alcuna geometria della struttura 'ZonaDenominata'."
["DMAV_Gebaeudeadressen_V1_1.Gebaeudeadressen.LokalisationGebaeudeeingang.CH121701"]
message_de="(CH121701) Ist die Lokalisation mit 'keineNummern' attribuiert, darf dem Gebäudeeingang keine 'Hausnummer' zugewiesen werden. Ist die Lokalisation nicht mit 'keineNummern' attribuiert, ist dem Gebäudeeingang eine 'Hausnummer' zuzuweisen."
message="(CH121701) Ist die Lokalisation mit 'keineNummern' attribuiert, darf dem Gebäudeeingang keine 'Hausnummer' zugewiesen werden. Ist die Lokalisation nicht mit 'keineNummern' attribuiert, ist dem Gebäudeeingang eine 'Hausnummer' zuzuweisen."
message_fr="(CH121701) Si la localisation est attribuée à 'pas_de_numeros', aucun 'NumeroMaison' ne doit être attribué à l'entrée du bâtiment. Si la localisation n'est pas attribuée à 'pas_de_numeros', un 'NumeroMaison ' doit être attribué à l'entrée du bâtiment."
message_it="(CH121701) Se la localizzazione è attribuita come 'nessun_numero', all'ingresso dell'edificio non deve essere assegnato alcun 'NumeroCivico'. Se la localizzazione non è attribuita come 'nessun_numero', all'ingresso dell'edificio deve essere assegnato un 'NumeroCivico'."
