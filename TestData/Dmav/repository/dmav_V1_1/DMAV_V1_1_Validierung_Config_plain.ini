["DMAV_Grundstuecke_V1_1.Grundstuecke.Grundstueck.CH042401"]
message_de="(CH042401) Wenn für ein Objekt 'Grundstueck' ein 'Gesamtflaechenmass' erfasst ist, müssen mehrere Objekte 'Liegenschaft', 'SelbstaendigesDauerndesRecht' oder 'Bergwerk' dem 'Grundstueck' zugewiesen sein.Wenn für ein Objekt 'Grundstueck' kein 'Gesamtflaechenmass' erfasst ist, darf nur ein Objekt 'Liegenschaft', 'SelbstaendigesDauerndesRecht' oder 'Bergwerk' dem 'Grundstueck' zugewiesen sein."
