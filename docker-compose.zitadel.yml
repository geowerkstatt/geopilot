# Opt-in override that runs ZITADEL as the local identity provider instead of Keycloak.
#
#   docker compose -f docker-compose.yml -f docker-compose.zitadel.yml up
#
# Why: production runs ZITADEL, local development runs Keycloak. That asymmetry is harmless
# for everyday work but not for changes to the login flow, because that is exactly where the
# two products differ (refresh tokens need the offline_access scope on ZITADEL, not on
# Keycloak). Those differences never show up against Keycloak.
#
# Keycloak stays the default and keeps running on 4011; the Cypress tests are wired to it and
# are not affected by this file. Nothing here is reached unless you pass -f explicitly.
#
# Three containers, not one: since v4 the login UI is a separate service, and it must answer
# under the same origin as the API because the OIDC issuer is http://localhost:4012. nginx
# does the routing that Traefik does in the cluster. This mirrors the official ZITADEL
# compose reference (zitadel/zitadel, deploy/compose).
#
# First start: see "ZITADEL lokal" in README.md. The instance is empty until you create the
# project and the two applications once in the console, then put their ids into .env.
services:
  # The API. Not published directly: the browser always goes through zitadel-proxy, so that
  # the issuer, the console and the login UI share one origin.
  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.15.3 # matches geow-ops (chart 10.0.4), so differences never come from the version
    restart: unless-stopped
    user: "0" # needs to write the login-client token into the bootstrap volume
    command: start-from-init --masterkeyFromEnv
    environment:
      # Local-only dev credentials, same category as the Keycloak and Postgres ones in
      # docker-compose.yml. Never reuse these anywhere that is reachable from outside.
      ZITADEL_MASTERKEY: geopilotLocalDevMasterKey32Byte! # must be exactly 32 bytes

      # The issuer in the discovery document is derived from these values, and it must equal
      # the Auth__Authority the API validates against AND the URL the browser opens.
      # localhost:4012 satisfies both: the browser reaches the published proxy port, and the
      # geopilot container resolves localhost to the host gateway (see its extra_hosts).
      ZITADEL_PORT: "8080"
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: "4012"
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"

      # Shares the geopilot Postgres instead of running a second one; local weight matters
      # more than the lifecycle isolation geow-ops has in the cluster. The admin user creates
      # the zitadel database on first start, HAPPYWALK is the superuser of that instance.
      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_MAXOPENCONNS: "10"
      ZITADEL_DATABASE_POSTGRES_MAXIDLECONNS: "5"
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: HAPPYWALK
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: SOMBERSPORK
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: HAPPYWALK
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: SOMBERSPORK
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable

      # Console login, created once against the empty database. Editing any FIRSTINSTANCE or
      # DEFAULTINSTANCE value later has no effect: they only apply while the database is empty.
      ZITADEL_FIRSTINSTANCE_ORG_NAME: geopilot
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: zitadel-admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: LocalDev1!
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"

      # The login UI authenticates against the API with a machine token that is minted here
      # and handed over through the shared bootstrap volume.
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat

      # A second machine user with IAM_OWNER, used by zitadel-provision to create the project,
      # the applications and the development users. Its key lands in the same bootstrap
      # volume, so provisioning needs no manually created credential.
      #
      # A key, not a personal access token: the terraform provider pinned to ~>2.2.0 offers
      # only jwt_file, jwt_profile_file and jwt_profile_json. Token support arrived later
      # under the name access_token. Production authenticates the same way.
      ZITADEL_FIRSTINSTANCE_MACHINEKEYPATH: /zitadel/bootstrap/admin-key.json
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: terraform
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Local provisioning
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINEKEY_TYPE: "1" # 1 is JSON, the only supported value
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINEKEY_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
      # Quoted: unquoted, YAML parses this as a timestamp and reformats it into a shape
      # ZITADEL rejects ("cannot parse ... as T").
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"

      # Relaxes the password policy so the development users can share the same simple
      # password as the Keycloak realm. The default demands an upper case letter, a number and
      # a symbol. Set here rather than through terraform because the provider's
      # zitadel_password_complexity_policy resource is broken: it creates the policy and then
      # reports "Root object was present, but now absent", which aborts the apply.
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_MINLENGTH: "8"
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_HASLOWERCASE: "true"
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_HASUPPERCASE: "false"
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_HASNUMBER: "false"
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_HASSYMBOL: "false"

      # Where ZITADEL sends the browser to authenticate. The v1 login UI no longer serves
      # content in v4, so these must point at the separate login service.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://localhost:4012/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://localhost:4012/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://localhost:4012/ui/v2/login/logout?post_logout_redirect=
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:rw
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  # The login UI. Separate service since v4; forgetting it makes the console fail with a 404
  # on /ui/v2/login, because that is where every authentication request is sent.
  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.15.3
    restart: unless-stopped
    user: "0" # reads the login-client token from the bootstrap volume
    environment:
      ZITADEL_API_URL: http://zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: Host:localhost,X-Forwarded-Proto:http
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    depends_on:
      zitadel:
        condition: service_healthy

  # Puts the API and the login UI under one origin. Traefik does this in the cluster.
  zitadel-proxy:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./config/nginx-zitadel.conf:/etc/nginx/nginx.conf:ro
    # Same port inside and outside, see the comment in nginx-zitadel.conf.
    ports:
      - "4012:4012"
    depends_on:
      zitadel:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy

  # Applies terraform/local once and exits, which creates the organization, the project, both
  # applications and the development users. This is the counterpart to Keycloak's
  # --import-realm, so nobody has to set the instance up by hand.
  #
  # The configuration is mounted read-only and copied into the state volume before running,
  # so terraform never writes into the repository and leaves no root-owned files behind.
  zitadel-provision:
    image: hashicorp/terraform:1.14
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        # Wait for the proxy to serve, not just to have started: terraform does not retry a
        # failed connection, and a race here fails the whole provisioning run.
        i=0
        until wget -q -O /dev/null http://localhost:4012/.well-known/openid-configuration; do
          i=$$((i + 1))
          [ "$$i" -lt 30 ] || { echo "ZITADEL not reachable on localhost:4012"; exit 1; }
          sleep 2
        done
        # The work directory survives every run, so stale copies of renamed or deleted .tf
        # files would keep being applied. Clear it before copying the current configuration.
        rm -f /work/*.tf
        cp /terraform/*.tf /terraform/.terraform.lock.hcl /work/
        cd /work
        terraform init -input=false
        terraform apply -auto-approve -input=false
        # Via variables, not straight into the file: "echo x=$(cmd)" succeeds even when cmd
        # fails, which would write empty ids and only surface later as a confusing login
        # error. An assignment under set -e aborts instead, and the emptiness check catches
        # an output that succeeds but returns nothing.
        CLIENT_ID=$$(terraform output -raw oidc_client_id)
        API_ID=$$(terraform output -raw api_client_id)
        if [ -z "$$CLIENT_ID" ] || [ -z "$$API_ID" ]; then
          echo "terraform returned an empty client id, aborting"
          exit 1
        fi
        mkdir -p /generated
        printf 'ZITADEL_CLIENT_ID=%s\nZITADEL_API_ID=%s\n' "$$CLIENT_ID" "$$API_ID" > /generated/zitadel.env
        echo "provisioned. Start with --env-file .env --env-file config/generated/zitadel.env"
    volumes:
      - ./terraform/local:/terraform:ro
      - ./config/generated:/generated
      - zitadel-terraform:/work
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    # Shares the proxy's network namespace, so localhost:4012 really is the proxy and the
    # Host header matches the issuer. Addressing the container as zitadel:8080 instead would
    # send a different Host and ZITADEL would not resolve the instance.
    #
    # extra_hosts with host-gateway does NOT work here: Docker appends that entry after the
    # default "127.0.0.1 localhost" in /etc/hosts, so localhost still resolves to the
    # container's own loopback and the connection is refused.
    network_mode: "service:zitadel-proxy"
    depends_on:
      zitadel-proxy:
        condition: service_started

  geopilot:
    environment:
      # Same set of values production sets via AUTH_* (geopilot-hosting/.env.example:110-117),
      # pointed at the local instance. The endpoint paths are ZITADEL's and differ from
      # Keycloak's, which is the point of running this override.
      Auth__Authority: http://localhost:4012
      Auth__AuthorizationUrl: http://localhost:4012/oauth/v2/authorize
      Auth__TokenUrl: http://localhost:4012/oauth/v2/token
      Auth__UserInfoUrl: http://localhost:4012/oidc/v1/userinfo
      # Mirrors production. No project scope is needed as long as the OIDC app and the API app
      # live in the same project: ZITADEL then puts the API id into aud on its own.
      Auth__Scope: "profile email openid"
      Auth__SwaggerAdditionalScopes: ""
      # Not read while Auth__AccessTokenFormat is Jwt (the default), but they keep the opaque
      # token path reachable locally. It is covered against Keycloak by KeycloakOpaqueTokenTest
      # and needs a confidential client, hence API_AUTH_METHOD_TYPE_BASIC in terraform/local.
      Auth__IntrospectionUrl: http://localhost:4012/oauth/v2/introspect
      Auth__IntrospectionAuthMethod: ClientSecretBasic
      Auth__ConfidentialClientId: ${ZITADEL_API_ID:-run-zitadel-provision-first}
      Auth__ConfidentialClientSecret: ${ZITADEL_API_SECRET:-run-zitadel-provision-first}
      # ZITADEL generates the client ids and the secret above, and none of them can be pinned,
      # so they come from the environment. zitadel-provision writes all three to
      # config/generated/zitadel.env, which is passed in with a second --env-file at start,
      # see README.md.
      #
      # Not via the service-level env_file key: the Keycloak values in docker-compose.yml are
      # set under environment and would take precedence over it. Making them overridable there
      # would in turn let a ZITADEL id break the default Keycloak start. These two names are
      # referenced only here, so they stay inert in Keycloak mode.
      Auth__PublicClientId: ${ZITADEL_CLIENT_ID:-run-zitadel-provision-first}
      Auth__Audience: ${ZITADEL_API_ID:-run-zitadel-provision-first}
    depends_on:
      zitadel-provision:
        condition: service_completed_successfully
      zitadel-proxy:
        condition: service_started

volumes:
  # Carries the login-client and provisioning tokens from the API container to the
  # login and provisioning containers.
  zitadel-bootstrap:
  # Terraform working directory and state. A volume, not a repository path, so a reset is
  # "remove the volume" and the checkout stays clean.
  zitadel-terraform:
