name: Docker Build Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: Validate Docker Build Configuration
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Docker build configuration
        uses: docker/build-push-action@v7
        with:
          context: .
          call: check

  refdata-update:
    runs-on: ubuntu-latest
    name: Test the refdata-update image
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the test stage, which runs the self-check
        uses: docker/build-push-action@v7
        with:
          context: docker/refdata-update
          target: test
