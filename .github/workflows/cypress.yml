name: Cypress Tests

on: [push]

permissions:
  contents: read
  packages: read

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    strategy:
      # The single entry keeps the check name "cypress-run (1)" that branch protection on main requires.
      matrix:
        containers: [1]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0"

      - name: Setup dev-certs
        uses: ./.github/actions/setup-dev-certs

      - name: Start db and api's
        run: docker compose -f docker-compose.yml -f docker-compose.cypress.yml up --wait
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          # npx sets npm_package_name, which vite.config.ts needs to find the dev certificate.
          command: npx cypress run
          wait-on: "https://localhost:5173"
          wait-on-timeout: 120
          working-directory: ./src/Geopilot.Frontend
        env:
          NODE_EXTRA_CA_CERTS: ${{ env.UBUNTU_TRUSTED_CERT_PATH }}

      - name: Upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots-${{ github.run_attempt }}
          path: ./src/Geopilot.Frontend/cypress/screenshots
          if-no-files-found: ignore
