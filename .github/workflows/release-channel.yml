name: Release channel

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  publish-release-image:
    runs-on: ubuntu-latest
    name: Publish the :release image for the acceptance environment
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether this state has to be built
        run: |
          base=$(git describe --tags --match 'v*' --abbrev=0 HEAD) || {
            echo "::error::No v* tag is reachable from this commit, so there is no version to count from."
            exit 1
          }
          echo IMAGE_NAME=$REGISTRY/$(echo ${GITHUB_REPOSITORY,,}) >> $GITHUB_ENV
          echo BASE_TAG=$base >> $GITHUB_ENV
          echo COMMITED_AT=$(git show -s --format=%cI HEAD) >> $GITHUB_ENV
          echo REVISION=$(git rev-parse --short HEAD) >> $GITHUB_ENV

          # A merge from main carries the tree that was already built and pushed as :$base, so that
          # image is reused instead of building the same source twice. The acceptance then runs the
          # very image a promotion would re-tag. Own commits on this branch change the tree and are
          # built here, versioned as <base>.<commits since base> so the number says what it is.
          if [ "$(git rev-parse "$base^{tree}")" = "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo MODE=retag >> $GITHUB_ENV
          else
            echo MODE=build >> $GITHUB_ENV
            echo VERSION=${base#v}.$(git rev-list --count "$base..HEAD") >> $GITHUB_ENV
          fi

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point :release at the image of the merged state
        if: env.MODE == 'retag'
        run: |
          docker buildx imagetools create \
            --tag ${IMAGE_NAME}:release \
            ${IMAGE_NAME}:${BASE_TAG}

      - name: Set up Docker Buildx
        if: env.MODE == 'build'
        uses: docker/setup-buildx-action@v4

      - name: Collect Docker image metadata
        id: meta
        if: env.MODE == 'build'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.created=${{ env.COMMITED_AT }}
            org.opencontainers.image.version=v${{ env.VERSION }}
            org.opencontainers.image.maintainer=GeoWerkstatt GmbH <support@geowerkstatt.ch>
          tags: |
            type=raw,value=release
            type=raw,value=v${{ env.VERSION }}

      - name: Build and push the release image
        if: env.MODE == 'build'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ env.VERSION }}
            REVISION=${{ env.REVISION }}
            GITHUB_ACTOR=${{ github.actor }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
